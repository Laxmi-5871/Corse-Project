<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Access | Report</title>
    <style>
        body { background-color: #f9f7f2; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-card { background: white; padding: 40px; border-radius: 40px; width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.04); }
        h2 { text-align: center; font-weight: 800; margin-bottom: 5px; }
        p.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
        label { font-size: 11px; font-weight: 700; color: #ccc; text-transform: uppercase; margin: 15px 0 5px 5px; display: block; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #eee; background: #fafafa; box-sizing: border-box; font-family: inherit; }
        .submit-btn { background: #2d3436; color: white; width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Campus Access</h2>
        <p class="sub">Identify yourself and report your lost item</p>

        <label>Account Info</label>
        <input type="email" placeholder="College Email (@kletech.ac.in)">
        <input type="password" placeholder="Password">

        <label>Lost Item Details</label>
        <input type="text" id="name" placeholder="What did you lose? (e.g. Blue Wallet)">
        <input type="date" id="date">
        <input type="text" id="loc" placeholder="Where was it last seen?">
        <textarea id="desc" placeholder="Describe the item (brand, color, marks...)" rows="3"></textarea>
        
        <p style="font-size: 12px; color: #888;">📸 Photo Upload (Optional)</p>
        <input type="file" accept="image/*">

        <button class="submit-btn" onclick="submitAndReturn()">Submit & Enter Space</button>
    </div>

    <script>
        function submitAndReturn() {
            const item = {
                itemName: document.getElementById("name").value,
                date: document.getElementById("date").value,
                location: document.getElementById("loc").value,
                description: document.getElementById("desc").value
            };

            if(!item.itemName) return alert("Please enter the item name!");

            // Save to browser memory
            let existing = JSON.parse(localStorage.getItem("lostData")) || [];
            existing.unshift(item);
            localStorage.setItem("lostData", JSON.stringify(existing));

            // CRITICAL: Must match your main file name exactly (Capital L)
            window.location.href = "Lost.html";
        }
    </script>
</body>
</html>
